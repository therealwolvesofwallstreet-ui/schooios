<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>SchooIOS — Ngưỡng cửa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fraunces (serif cách tân) · Geist (system sans) · Geist Mono — tất cả có Vietnamese -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F4EF; --ink:#1A1916; --muted:#8A8780; --teal:#1A4A5A;
    --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#F7F4EF;cursor:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #cursor{position:fixed;width:7px;height:7px;border-radius:50%;
    border:1px solid rgba(26,74,90,.55);pointer-events:none;z-index:50;
    transform:translate(-50%,-50%);transition:width .25s,height .25s,opacity .4s;opacity:0}
  .overlay{position:fixed;inset:0;pointer-events:none;z-index:30}
  .manifesto{position:absolute;left:0;right:0;bottom:62px;text-align:center;
    font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted);
    opacity:0;padding:0 24px;line-height:1.9}
  .hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--teal);
    opacity:0;text-transform:uppercase}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:40;background:var(--cream);font-family:var(--mono);font-size:11px;
    letter-spacing:.3em;color:var(--muted);text-transform:uppercase;transition:opacity .8s}
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="cursor"></div>
  <div class="overlay">
    <div class="manifesto" id="manifesto">Nó không hiện diện để được nhìn thấy.<br>Nó hiện diện để bạn làm việc tốt hơn.</div>
    <div class="hint" id="hint">Chạm để bước vào</div>
  </div>
  <div class="loading" id="loading">Đang lắng…</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const VERT = /* glsl */`
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const FRAG = /* glsl */`
  precision highp float;
  varying vec2 vUv;
  uniform float uTime, uRevealA, uRevealB, uCalm, uMouseStr, uFlare, uExit;
  uniform vec2  uRes, uMouse;
  uniform sampler2D uWord;

  const vec3 CREAM = vec3(0.969,0.957,0.937);
  const vec3 INK   = vec3(0.102,0.098,0.086);
  const vec3 TEAL  = vec3(0.102,0.290,0.353);

  float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){
    vec2 i=floor(p), f=fract(p);
    float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
    vec2 u=f*f*(3.0-2.0*f);
    return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
  }
  float fbm(vec2 p){
    float v=0.0, a=0.5;
    for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.0; a*=0.5; }
    return v;
  }
  float ember(vec2 uv, vec2 c, float k){ return exp(-distance(uv,c)*k); }

  void main(){
    vec2 uv = vUv;
    float asp = uRes.x/uRes.y;
    vec2 p = vec2(uv.x*asp, uv.y);

    float t = uTime*0.035;
    float turb = mix(1.0, 0.30, uCalm);

    // mouse: part the ink like a hand through still water — heavy, decaying
    vec2 m = vec2(uMouse.x*asp, uMouse.y);
    float md = distance(p, m);
    float ripple = uMouseStr * exp(-md*3.0) * 0.13;

    vec2 q = vec2( fbm(p*2.0 + t + ripple), fbm(p*2.0 + vec2(5.2,1.3) - t) );
    float field = fbm(p*2.4 + 2.2*q*turb + vec2(0.0, t*0.4) + ripple*2.2);

    vec3 col = mix(CREAM, CREAM*0.978, smoothstep(0.30,0.85,field));

    float light = clamp(1.0 - distance(uv, vec2(0.16,0.12))*0.62, 0.0, 1.0);
    light *= 0.85 + 0.15*sin(uTime*0.5);
    col += vec3(0.018) * light;

    float vein = smoothstep(0.46,0.50,field) - smoothstep(0.50,0.54,field);
    col = mix(col, INK, vein*0.085*(1.0 - uCalm*0.45));

    // ---- WORDMARK: two voices, two reveals ----
    vec4 wtex = texture2D(uWord, uv);
    float maskA = wtex.r; // "Schoo" — serif / human
    float maskB = wtex.g; // "IOS"   — sans / system
    // serif blooms soft, left->right
    float sweepA = smoothstep(uRevealA-0.20, uRevealA+0.05, uv.x);
    float onA = maskA * (1.0 - sweepA) * (1.0 - uExit);
    // system snaps in crisp
    float sweepB = smoothstep(uRevealB-0.05, uRevealB+0.015, uv.x);
    float onB = maskB * (1.0 - sweepB) * (1.0 - uExit);

    col = mix(col, INK, onA);
    col += TEAL * onA * 0.05 * light;
    col = mix(col, INK, onB);
    col += TEAL * onB * 0.12 * light;   // the system half carries the rare color

    // one rare teal signal — the voice beneath, breathing
    vec2 s1 = vec2(0.50 + 0.15*sin(uTime*0.13), 0.30 + 0.04*cos(uTime*0.10));
    float flare = 0.40 + uFlare*2.2;
    col += TEAL * ember(uv, s1, 60.0) * flare;
    col += TEAL * ember(uv, vec2(0.74 + 0.05*sin(uTime*0.09+2.0), 0.66 + 0.05*sin(uTime*0.12)), 80.0) * 0.22;

    col = mix(col, vec3(1.0), uExit*uExit*0.9);

    float gr = hash(uv*uRes + fract(uTime)) * 2.0 - 1.0;
    col += gr * 0.014;

    float vig = smoothstep(1.25, 0.35, distance(uv, vec2(0.5)));
    col *= mix(1.0, vig, 0.22);

    gl_FragColor = vec4(col, 1.0);
  }
`;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.6));
const scene = new THREE.Scene();
const cam = new THREE.Camera();

const wordCanvas = document.createElement('canvas');
const wctx = wordCanvas.getContext('2d');
const wordTex = new THREE.CanvasTexture(wordCanvas); // flipY=true by default → draw upright
wordTex.minFilter = THREE.LinearFilter; wordTex.magFilter = THREE.LinearFilter;

const uniforms = {
  uTime:{value:0}, uRevealA:{value:0}, uRevealB:{value:0}, uCalm:{value:0},
  uMouseStr:{value:0}, uFlare:{value:0}, uExit:{value:0},
  uRes:{value:new THREE.Vector2(1,1)}, uMouse:{value:new THREE.Vector2(0.5,0.5)},
  uWord:{value:wordTex}
};
const mat = new THREE.ShaderMaterial({ vertexShader:VERT, fragmentShader:FRAG, uniforms });
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));

function drawWord(){
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(devicePixelRatio||1, 2);
  wordCanvas.width = w*dpr; wordCanvas.height = h*dpr;
  wctx.setTransform(dpr,0,0,dpr,0,0);
  wctx.clearRect(0,0,w,h);
  wctx.fillStyle = '#000'; wctx.fillRect(0,0,w,h);

  const fs = Math.min(w*0.145, 215);
  const y = h*0.45;
  const serif = `italic 500 ${fs}px "Fraunces", Georgia, serif`;
  const sans  = `600 ${fs*0.82}px "Geist", system-ui, sans-serif`;
  wctx.textBaseline = 'middle';
  wctx.textAlign = 'left';

  // measure
  wctx.font = serif; const wA = wctx.measureText('Schoo').width;
  wctx.font = sans;  if('letterSpacing' in wctx) wctx.letterSpacing = (fs*0.04)+'px';
  const wB = wctx.measureText('IOS').width + fs*0.04*2;
  if('letterSpacing' in wctx) wctx.letterSpacing = '0px';

  const gap = fs*0.05;
  const total = wA + gap + wB;
  const x0 = (w - total)/2;

  // R channel = serif "Schoo" (human) · G channel = sans "IOS" (system)
  wctx.font = serif; wctx.fillStyle = '#ff0000';
  wctx.fillText('Schoo', x0, y);
  wctx.font = sans;  wctx.fillStyle = '#00ff00';
  if('letterSpacing' in wctx) wctx.letterSpacing = (fs*0.04)+'px';
  wctx.fillText('IOS', x0 + wA + gap, y - fs*0.02);
  if('letterSpacing' in wctx) wctx.letterSpacing = '0px';

  wordTex.needsUpdate = true;
}

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  uniforms.uRes.value.set(w,h);
  drawWord();
}
addEventListener('resize', resize);

const cursorEl = document.getElementById('cursor');
const target = new THREE.Vector2(0.5,0.5);
let lastMove = -10;
addEventListener('pointermove', e=>{
  target.set(e.clientX/innerWidth, 1 - e.clientY/innerHeight);
  cursorEl.style.left = e.clientX+'px'; cursorEl.style.top = e.clientY+'px';
  cursorEl.style.opacity = 1;
  lastMove = clock.getElapsedTime();
});

let exiting=false;
addEventListener('pointerdown', ()=>{
  if(exiting) return; exiting=true;
  gsap.timeline({onComplete:()=>{exiting=false;}})
    .to(uniforms.uFlare,  {value:1.0, duration:0.28, ease:'power2.out'})
    .to(uniforms.uExit,   {value:1.0, duration:0.55, ease:'power2.in'}, 0)
    .to(uniforms.uRevealA,{value:0.0, duration:0.55, ease:'power2.in'}, 0)
    .to(uniforms.uRevealB,{value:0.0, duration:0.45, ease:'power3.in'}, 0)
    .add('reset')
    .to(uniforms.uExit,   {value:0.0, duration:1.1, ease:'power2.out'}, 'reset')
    .to(uniforms.uFlare,  {value:0.0, duration:1.4, ease:'power2.out'}, 'reset')
    .to(uniforms.uRevealA,{value:1.0, duration:2.4, ease:'power2.out'}, 'reset+=0.15')
    .to(uniforms.uRevealB,{value:1.0, duration:1.4, ease:'power4.out'}, 'reset+=0.75');
});

const clock = new THREE.Clock();
function loop(){
  const tt = clock.getElapsedTime();
  uniforms.uTime.value = tt;
  uniforms.uMouse.value.lerp(target, 0.045);
  const since = tt - lastMove;
  const wantStr = since < 0.1 ? 1.0 : Math.max(0, 1 - since*0.8);
  uniforms.uMouseStr.value += (wantStr - uniforms.uMouseStr.value)*0.06;
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}

async function boot(){
  try{
    await document.fonts.load('italic 500 200px "Fraunces"', 'Schoo');
    await document.fonts.load('600 200px "Geist"', 'IOS');
    await document.fonts.load('500 12px "Geist Mono"', 'Đang');
    await document.fonts.ready;
  }catch(e){}
  resize();
  loop();

  const load = document.getElementById('loading');
  gsap.to(load, {opacity:0, duration:0.8, delay:0.3, onComplete:()=>load.remove()});

  // choreography — serif blooms human, system snaps precise, later
  gsap.timeline({delay:0.6})
    .to(uniforms.uCalm,    {value:1.0, duration:4.2, ease:'power2.inOut'}, 0)
    .to(uniforms.uRevealA, {value:1.0, duration:3.0, ease:'power2.out'}, 0.9)
    .to(uniforms.uRevealB, {value:1.0, duration:1.5, ease:'power4.out'}, 2.1)
    .to('#manifesto', {opacity:1, duration:1.8, ease:'power1.out'}, 2.8)
    .to('#hint',      {opacity:1, duration:1.6, ease:'power1.out'}, 3.8);
}
boot();
</script>
</body>
</html>
