<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, initial-scale=1.0" />
<title>SchooIOS — Đăng nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#050507;
    --surface:#0F1117;
    --text:#ECEBE7;
    --text-dim:#9A9384;
    --accent:#D72638;
    --accent2:#2E4A5C;
    --rim:#B8D4E0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ===== STAGE ===== */
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    /* graded value-step void: black ladder lifting toward the mark, asymmetric upward */
    background:
      radial-gradient(120% 95% at 50% 41%,
        #14171F 0%,
        #0F1117 22%,
        #0A0B10 46%,
        #07080B 68%,
        #050507 100%);
  }
  /* dithered grain overlay to kill banding */
  .grain{
    position:absolute;
    inset:-50%;
    width:200%;
    height:200%;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grainShift 1.1s steps(3) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}
    33%{transform:translate(-2%,1%)}
    66%{transform:translate(1%,-2%)}
    100%{transform:translate(0,0)}
  }

  /* faint vignette to deepen edges */
  .vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 120% at 50% 44%,transparent 52%,rgba(0,0,0,.55) 100%);
  }

  /* ===== WORDMARK (tiny, top-left, near-invisible) ===== */
  .wordmark{
    position:absolute;
    top:38px;left:48px;
    font-size:16px;
    letter-spacing:.01em;
    z-index:6;
    opacity:.62;
  }
  .wordmark .schoo{
    font-family:'Newsreader',serif;
    font-style:italic;
    font-weight:500;
    color:var(--text);
  }
  .wordmark .ios{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    color:var(--text-dim);
    letter-spacing:.06em;
  }

  /* top-right status whisper */
  .topstatus{
    position:absolute;
    top:40px;right:48px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--text-dim);
    opacity:.55;
    z-index:6;
  }
  .topstatus .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);
    margin-right:8px;vertical-align:middle;
    box-shadow:0 0 6px 1px rgba(215,38,56,.8);
    animation:liveblink 2.6s ease-in-out infinite;
  }
  @keyframes liveblink{0%,100%{opacity:1}50%{opacity:.35}}

  /* ===== FOCAL SIGNAL MARK ===== */
  .focal{
    position:absolute;
    top:41%;left:50%;
    transform:translate(-50%,-50%);
    width:210px;height:210px;
    z-index:4;
    display:grid;place-items:center;
  }
  /* the sculptural wax-seal disc */
  .disc{
    position:relative;
    width:148px;height:148px;
    border-radius:50%;
    /* body: dark surface catching cool steel rim on upper-left silhouette edge */
    background:
      radial-gradient(64% 64% at 38% 33%, #20242E 0%, #15171E 40%, #0C0E13 78%, #090A0E 100%);
    /* rim light = cool steel edge ONLY (not a fill) + tight red ambient seat */
    box-shadow:
      /* cool steel rim on the silhouette edge */
      inset 2px 2.5px 0 .4px rgba(184,212,224,.85),
      inset 1px 1.5px 8px -1px rgba(46,74,92,.9),
      /* opposite edge core shadow to read as a solid object */
      inset -3px -4px 14px -2px rgba(0,0,0,.85),
      /* crisp red ambient seat under the disc (outer, no fog) */
      0 16px 40px -14px rgba(215,38,56,.30),
      0 2px 0 0 rgba(0,0,0,.6);
    display:grid;place-items:center;
    animation:breathe 24s ease-in-out infinite;
  }
  /* inner emitting face — TIGHT red, crisp edge (inner blur 0) + vivid not foggy */
  .seal{
    position:relative;
    width:66px;height:66px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 44%, #FF5566 0%, #E32A3D 34%, #C21B2C 64%, #8E1320 100%);
    box-shadow:
      /* crisp inner edge: blur 0 */
      0 0 0 1px rgba(255,120,130,.55),
      /* tight vivid glow, small radius */
      0 0 14px 1px rgba(215,38,56,.85),
      0 0 30px 2px rgba(215,38,56,.40),
      /* negative-spread ambient = vivid core not a cloud */
      0 0 60px -8px rgba(215,38,56,.55),
      inset 0 1px 2px rgba(255,170,178,.5),
      inset 0 -6px 12px rgba(110,12,24,.7);
    animation:emit 24s ease-in-out infinite;
  }
  /* engraved signal glyph on the seal face */
  .seal::after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    width:2px;height:26px;
    transform:translate(-50%,-58%);
    background:linear-gradient(180deg,rgba(20,4,8,.0),rgba(20,4,8,.55) 30%,rgba(20,4,8,.55) 70%,rgba(20,4,8,0));
    border-radius:2px;
  }
  .seal::before{
    content:"";
    position:absolute;
    top:62%;left:50%;
    width:8px;height:8px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(20,4,8,.6),rgba(20,4,8,0) 70%);
  }
  /* expanding ring on breathe (the 'voice waiting') */
  .ring{
    position:absolute;
    top:50%;left:50%;
    width:148px;height:148px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(215,38,56,.45);
    opacity:0;
    animation:pulsering 24s ease-out infinite;
  }
  @keyframes breathe{
    0%,100%{box-shadow:
      inset 2px 2.5px 0 .4px rgba(184,212,224,.85),
      inset 1px 1.5px 8px -1px rgba(46,74,92,.9),
      inset -3px -4px 14px -2px rgba(0,0,0,.85),
      0 16px 40px -14px rgba(215,38,56,.26),
      0 2px 0 0 rgba(0,0,0,.6);}
    50%{box-shadow:
      inset 2px 2.5px 0 .4px rgba(200,224,234,.95),
      inset 1px 1.5px 9px -1px rgba(46,74,92,1),
      inset -3px -4px 14px -2px rgba(0,0,0,.85),
      0 18px 52px -12px rgba(215,38,56,.46),
      0 2px 0 0 rgba(0,0,0,.6);}
  }
  @keyframes emit{
    0%,100%{
      box-shadow:
        0 0 0 1px rgba(255,120,130,.5),
        0 0 12px 1px rgba(215,38,56,.78),
        0 0 26px 2px rgba(215,38,56,.34),
        0 0 52px -8px rgba(215,38,56,.45),
        inset 0 1px 2px rgba(255,170,178,.5),
        inset 0 -6px 12px rgba(110,12,24,.7);
      filter:brightness(.94);
    }
    50%{
      box-shadow:
        0 0 0 1px rgba(255,150,158,.7),
        0 0 18px 2px rgba(215,38,56,.95),
        0 0 40px 4px rgba(215,38,56,.5),
        0 0 78px -6px rgba(215,38,56,.62),
        inset 0 1px 2px rgba(255,190,196,.65),
        inset 0 -6px 12px rgba(110,12,24,.7);
      filter:brightness(1.12);
    }
  }
  @keyframes pulsering{
    0%{opacity:0;width:148px;height:148px;}
    8%{opacity:.5;}
    40%{opacity:0;width:300px;height:300px;}
    100%{opacity:0;width:300px;height:300px;}
  }

  /* mono serial under the mark */
  .serial{
    position:absolute;
    top:calc(41% + 132px);left:50%;
    transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--text-dim);
    z-index:5;
    white-space:nowrap;
  }
  .serial .live{color:var(--accent);opacity:.92;}

  /* ===== EDITORIAL VOICE LINE (lower-left negative space) ===== */
  .voice{
    position:absolute;
    left:80px;bottom:300px;
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:48px;
    line-height:1.08;
    color:var(--text);
    z-index:5;
    max-width:420px;
  }
  .voice .en{
    display:block;
    font-style:italic;
    font-size:19px;
    color:var(--text-dim);
    margin-top:14px;
    letter-spacing:.01em;
  }

  /* ===== LOGIN FORM (bottom-left column, hairline-underlined) ===== */
  .form{
    position:absolute;
    left:80px;bottom:72px;
    width:340px;
    z-index:5;
  }
  .field{margin-bottom:30px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  .field .underline{
    position:relative;
    border-bottom:1px solid rgba(154,147,132,.32);
    transition:border-color .25s ease;
  }
  .field .underline.focused{
    border-bottom-color:var(--accent);
  }
  .field .underline.focused::after{
    content:"";
    position:absolute;left:0;bottom:-1px;height:1px;width:100%;
    background:var(--accent);
    box-shadow:0 0 8px rgba(215,38,56,.7);
  }
  .field input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:17px;
    font-weight:400;
    padding:4px 2px 9px;
    letter-spacing:.01em;
  }
  .field input::placeholder{color:rgba(154,147,132,.45);}

  /* CTA */
  .cta{
    margin-top:8px;
    display:inline-flex;
    align-items:center;
    gap:14px;
    background:var(--accent);
    color:#FFF;
    border:none;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:.04em;
    padding:15px 30px;
    cursor:pointer;
    position:relative;
    transition:transform .18s ease, box-shadow .25s ease;
    box-shadow:
      0 0 0 1px rgba(255,120,130,.35),
      0 2px 14px -4px rgba(215,38,56,.6),
      0 0 36px -10px rgba(215,38,56,.7);
  }
  .cta:hover{
    transform:translateY(-1px);
    box-shadow:
      0 0 0 1px rgba(255,140,150,.5),
      0 4px 20px -4px rgba(215,38,56,.75),
      0 0 50px -10px rgba(215,38,56,.85);
  }
  .cta .arrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    transition:transform .2s ease;
  }
  .cta:hover .arrow{transform:translateX(4px);}

  .formfoot{
    margin-top:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    opacity:.6;
  }
  .formfoot a{color:var(--text-dim);text-decoration:none;border-bottom:1px solid rgba(154,147,132,.3);}

  @media (prefers-reduced-motion: reduce){
    .disc,.seal,.ring,.grain,.topstatus .dot{animation:none !important;}
    .seal{filter:none;}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grain"></div>

    <!-- tiny two-voice wordmark -->
    <div class="wordmark"><span class="schoo">Schoo</span><span class="ios">IOS</span></div>
    <div class="topstatus"><span class="dot"></span>ĐÀI LẶNG · ĐANG NGHE</div>

    <!-- focal signal mark -->
    <div class="focal">
      <div class="ring"></div>
      <div class="disc">
        <div class="seal"></div>
      </div>
    </div>
    <div class="serial">SIGNAL · <span class="live">LIVE</span> · CH·LTT</div>

    <!-- editorial voice -->
    <div class="voice">
      Lắng.
      <span class="en">A signal waiting to be heard.</span>
    </div>

    <!-- login form -->
    <form class="form" onsubmit="return false;">
      <div class="field">
        <label>Số báo danh / Email</label>
        <div class="underline" id="u1">
          <input type="text" placeholder="Nhập SBD hoặc email trường" autocomplete="off"
                 onfocus="document.getElementById('u1').classList.add('focused')"
                 onblur="document.getElementById('u1').classList.remove('focused')" />
        </div>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <div class="underline" id="u2">
          <input type="password" placeholder="••••••••"
                 onfocus="document.getElementById('u2').classList.add('focused')"
                 onblur="document.getElementById('u2').classList.remove('focused')" />
        </div>
      </div>
      <button class="cta" type="submit">Bước vào <span class="arrow">→</span></button>
      <div class="formfoot">Lần đầu đăng nhập? <a href="#">Đổi mật khẩu</a></div>
    </form>

    <div class="vignette"></div>
  </div>
</body>
</html>
