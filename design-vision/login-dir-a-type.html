<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SchooIOS — Bước vào</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0B0B0F;
    --surface:#16161B;
    --raised:#1C1E24;
    --text:#F4F2EC;
    --dim:#8A8678;
    --accent:#D72638;
    --hair:rgba(244,242,236,0.10);
    --hair-soft:rgba(244,242,236,0.06);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---- film grain over the whole canvas, crisp, no edge softening ---- */
  .grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0.06;
    mix-blend-mode:overlay;
  }

  /* ---- 3-step luminance ladder: void → form panel → raised rail ---- */
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    min-height:800px;
    background:var(--bg);
    overflow:hidden;
  }

  /* eyebrow running vertically up the left gutter, mono */
  .gutter-eyebrow{
    position:absolute;
    left:34px;
    bottom:48px;
    transform:rotate(-90deg);
    transform-origin:left bottom;
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
    white-space:nowrap;
    z-index:6;
  }
  .gutter-eyebrow .sig{color:var(--accent);}

  /* version sub-caption, mono, bottom-right ledger feel */
  .version{
    position:absolute;
    right:40px;
    bottom:34px;
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--dim);
    z-index:6;
  }

  /* ---- the wordmark, architectural scale, anchored hard left ---- */
  .wordmark-wrap{
    position:absolute;
    left:-10px;            /* bleed slightly off the left edge */
    top:50%;
    transform:translateY(-50%);
    z-index:4;
    user-select:none;
  }

  .eyebrow-top{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
    margin-left:64px;
    margin-bottom:22px;
  }

  .wordmark{
    display:block;
    width:min(72vw,1020px);
    height:auto;
  }
  .wordmark .schoo{
    font-family:"Newsreader",serif;
    font-style:italic;
    font-weight:500;
    fill:var(--text);
  }
  .wordmark .ios{
    font-family:"IBM Plex Sans",sans-serif;
    font-style:normal;
    font-weight:600;
    fill:var(--text);
  }
  .wordmark .seam{
    stroke:var(--hair);
    stroke-width:1;
  }
  .wordmark .sentinel{
    fill:var(--accent);
  }

  .tagline{
    font-family:"Newsreader",serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
    color:var(--dim);
    margin-left:66px;
    margin-top:26px;
    letter-spacing:0.005em;
  }

  /* ---- form: narrow column pushed to right third on a hairline rail ---- */
  .panel{
    position:absolute;
    top:0;
    right:0;
    height:100%;
    width:340px;
    background:linear-gradient(180deg,var(--surface) 0%, #131318 100%);
    border-left:1px solid var(--hair);
    z-index:3;
  }
  /* top-edge light-catch hairline on the panel */
  .panel::before{
    content:"";
    position:absolute;
    left:0;right:0;top:0;height:1px;
    background:var(--hair);
  }

  .form-col{
    position:absolute;
    top:50%;
    right:0;
    transform:translateY(-50%);
    width:340px;
    padding:0 44px;
    z-index:5;
  }

  .form-eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:34px;
  }

  .field{
    margin-bottom:30px;
  }
  .field label{
    display:block;
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:12px;
  }
  /* raised field plane (#1C1E24) with top-edge light-catch hairline + red underline */
  .field .inset{
    position:relative;
    background:var(--raised);
    border:1px solid rgba(244,242,236,0.05);
    border-top-color:var(--hair);
  }
  .field input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:"IBM Plex Sans",sans-serif;
    font-weight:500;
    font-size:16px;
    letter-spacing:0.01em;
    padding:14px 14px 13px;
  }
  .field input::placeholder{
    color:#55524a;
  }
  /* the focus underline: 1px → red, drawn left-to-right */
  .field .underline{
    position:absolute;
    left:0;bottom:-1px;
    height:1px;
    width:100%;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:left center;
    transition:transform 150ms cubic-bezier(.16,1,.3,1);
  }
  .field input:focus ~ .underline{
    transform:scaleX(1);
  }

  /* ---- CTA: the one bold accent fill ---- */
  .cta{
    width:100%;
    margin-top:8px;
    background:var(--accent);
    color:var(--text);
    border:none;
    cursor:pointer;
    font-family:"IBM Plex Sans",sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    padding:15px 0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-left:18px;
    padding-right:18px;
    transition:filter 150ms ease, background 150ms ease;
  }
  .cta:hover{ filter:brightness(1.08); }
  .cta .arrow{
    font-family:"IBM Plex Mono",monospace;
    font-weight:400;
    font-size:15px;
    opacity:0.85;
  }

  .help{
    margin-top:24px;
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--dim);
    line-height:1.7;
  }
  .help a{ color:var(--text); text-decoration:none; border-bottom:1px solid var(--hair); }

  /* ===== ENTRY RITUAL ===== */
  .voice-schoo{
    opacity:0;
    transform:translateY(16px);
    animation:riseSchoo 520ms cubic-bezier(.16,1,.3,1) 160ms forwards;
  }
  .voice-ios{
    opacity:0;
    transform:translateX(60px);
    animation:slideIos 520ms cubic-bezier(.16,1,.3,1) 420ms forwards;
  }
  .sentinel{
    opacity:0;
    animation:blinkSentinel 600ms ease 900ms forwards;
  }
  .seam{
    opacity:0;
    animation:fadeSeam 400ms ease 820ms forwards;
  }
  .fade-late{
    opacity:0;
    animation:fadeLate 600ms ease 1000ms forwards;
  }

  @keyframes riseSchoo{
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes slideIos{
    to{opacity:1;transform:translateX(0);}
  }
  @keyframes fadeSeam{ to{opacity:1;} }
  @keyframes blinkSentinel{
    0%{opacity:0;}
    40%{opacity:1;}
    62%{opacity:0.15;}
    100%{opacity:1;}
  }
  @keyframes fadeLate{ to{opacity:1;} }

  @media (prefers-reduced-motion: reduce){
    .voice-schoo,.voice-ios,.seam,.fade-late{
      animation:none;opacity:1;transform:none;
    }
    .sentinel{
      animation:blinkSentinel 600ms ease 200ms forwards;
    }
  }
</style>
</head>
<body>

<!-- film grain: feTurbulence, crisp overlay, no blur -->
<svg class="grain" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#g)"/>
</svg>

<main class="stage">

  <!-- vertical mono eyebrow up the left gutter (off-grid diagonal axis) -->
  <div class="gutter-eyebrow fade-late">A LEDGER OF VOICES &nbsp;—&nbsp; <span class="sig">SCH-2026</span></div>

  <!-- the wordmark: architectural, anchored hard-left, bleeding off edge -->
  <div class="wordmark-wrap">
    <div class="eyebrow-top fade-late">HỆ THỐNG QUẢN LÝ SỰ VỤ HỌC ĐƯỜNG</div>

    <svg class="wordmark" viewBox="0 0 1020 240" preserveAspectRatio="xMinYMid meet" aria-label="SchooIOS">
      <!-- 'Schoo' — serif italic voice -->
      <text class="schoo voice-schoo" x="0" y="172" font-size="200" letter-spacing="-8">Schoo</text>

      <!-- the vertical hairline seam where the two voices collide -->
      <line class="seam" x1="612" y1="34" x2="612" y2="196"/>

      <!-- the single signal-red sentinel dot living in the seam -->
      <circle class="sentinel" cx="612" cy="150" r="9"/>

      <!-- 'IOS' — sans roman voice -->
      <text class="ios voice-ios" x="628" y="172" font-size="200" letter-spacing="-6">IOS</text>
    </svg>

    <div class="tagline fade-late">Mỗi tiếng nói đều được lắng nghe.</div>
  </div>

  <!-- right-third form panel on a single vertical hairline rail -->
  <aside class="panel fade-late"></aside>

  <div class="form-col fade-late">
    <div class="form-eyebrow">ĐĂNG NHẬP &nbsp;·&nbsp; XÁC THỰC</div>

    <div class="field">
      <label for="id">Số báo danh / Email</label>
      <div class="inset">
        <input id="id" type="text" placeholder="VD: 220145 hoặc gv@ltt.edu.vn" autocomplete="username" />
        <span class="underline"></span>
      </div>
    </div>

    <div class="field">
      <label for="pw">Mật khẩu</label>
      <div class="inset">
        <input id="pw" type="password" placeholder="••••••" autocomplete="current-password" />
        <span class="underline"></span>
      </div>
    </div>

    <button class="cta" type="button">
      <span>Bước vào</span>
      <span class="arrow">→</span>
    </button>

    <div class="help">
      Lần đầu đăng nhập? Bạn sẽ được<br/>yêu cầu đổi mật khẩu. <a href="#">Trợ giúp</a>
    </div>
  </div>

  <div class="version fade-late">v9.0 · CASE-2026-00001</div>

</main>

</body>
</html>
