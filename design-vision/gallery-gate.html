<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>SchooIOS — Cổng Triển Lãm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Newsreader (Canela twin, có Vietnamese) · IBM Plex Sans · Geist Mono — đều VN-safe -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2EA; --ink:#111111; --muted:#8C887F; --red:#D72638;
    --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#F6F2EA;cursor:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #cursor{position:fixed;width:8px;height:8px;border-radius:50%;
    border:1px solid rgba(215,38,56,.6);pointer-events:none;z-index:50;
    transform:translate(-50%,-50%);transition:width .25s,height .25s,opacity .4s;opacity:0}
  .overlay{position:fixed;inset:0;pointer-events:none;z-index:30}
  .manifesto{position:absolute;left:0;right:0;bottom:64px;text-align:center;
    font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted);
    opacity:0;padding:0 24px;line-height:1.9}
  .hint{position:absolute;left:0;right:0;bottom:32px;text-align:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.36em;color:var(--red);
    opacity:0;text-transform:uppercase}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:40;background:var(--paper);font-family:var(--mono);font-size:11px;
    letter-spacing:.32em;color:var(--muted);text-transform:uppercase;transition:opacity .8s}
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="cursor"></div>
  <div class="overlay">
    <div class="manifesto" id="manifesto">Mỗi tiếng nói là một tín hiệu.</div>
    <div class="hint" id="hint">Chạm để bước vào</div>
  </div>
  <div class="loading" id="loading">Đang lắng…</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- background: museum hall + the red Pulse ---------- */
const BG_VERT = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;

const BG_FRAG = /* glsl */`
  precision highp float;
  varying vec2 vUv;
  uniform float uTime,uRevealA,uRevealB,uEnter,uIgnite,uMouseStr;
  uniform vec2 uRes,uMouse;
  uniform sampler2D uWord;

  const vec3 PAPER = vec3(0.965,0.949,0.918); // F6F2EA
  const vec3 INK   = vec3(0.067,0.067,0.067); // 111111
  const vec3 RED   = vec3(0.843,0.149,0.220); // D72638

  float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){ vec2 i=floor(p),f=fract(p);
    float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
    vec2 u=f*f*(3.0-2.0*f); return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
  float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.0; a*=0.5;} return v; }

  void main(){
    float asp = uRes.x/uRes.y;
    // dolly into the orb on enter
    vec2 uv = mix(vUv, vec2(0.5,0.60), uEnter*0.55);

    vec2 oc = vec2(0.5, 0.60);
    vec2 d = uv - oc; d.x *= asp;
    float r = length(d);

    // --- the hall: warm air + skylight from above + darker floor (depth) ---
    float air = fbm(uv*2.0 + uTime*0.02 + (uMouse-0.5)*0.1*uMouseStr);
    vec3 col = mix(PAPER, PAPER*0.985, smoothstep(0.30,0.85,air));
    col *= mix(0.95, 1.045, uv.y);                       // floor darker, vault brighter
    float skylight = clamp(1.0 - distance(uv, vec2(0.5,0.95))*0.7, 0.0, 1.0);
    col += vec3(0.02) * skylight;

    // warm light shaft falling from the orb
    float below = smoothstep(oc.y+0.06, 0.0, uv.y);
    col += vec3(0.05,0.043,0.034) * exp(-abs(d.x)*7.0) * below * 0.9;

    // --- THE PULSE (red sun) ---
    float breathe = 0.5 + 0.5*sin(uTime*0.7);
    float ignite  = uIgnite;
    float coreR = 0.050 + breathe*0.004;
    vec2  hl = d - vec2(-0.014, 0.018);                  // highlight up-left
    float shade = clamp(1.0 - length(hl)/(coreR*1.7), 0.0, 1.0);
    vec3  orbCol = mix(RED*0.72, RED*1.18, shade);
    float core = smoothstep(coreR, coreR*0.18, r);
    col = mix(col, orbCol, core*ignite);
    // soft halo glow
    float glow = exp(-r*8.5) * (0.55 + breathe*0.30) * ignite;
    col += RED * glow * 0.55;
    // faint vertical rays
    float ray = exp(-abs(d.x)*42.0) * exp(-abs(d.y)*1.8) * 0.16 * ignite;
    col += RED * ray * (0.4 + breathe*0.3);

    // expanding signal rings — the pulse emitting
    float rr = fract(r*6.5 - uTime*0.30);
    float rings = smoothstep(0.0,0.06,rr) * smoothstep(0.16,0.06,rr);
    rings *= smoothstep(0.44, 0.07, r) * ignite;
    col += RED * rings * 0.085;

    // --- WORDMARK (below the sun): two voices, two reveals ---
    vec4 wt = texture2D(uWord, uv);
    float sweepA = smoothstep(uRevealA-0.20, uRevealA+0.05, uv.x);
    float onA = wt.r * (1.0 - sweepA);
    float sweepB = smoothstep(uRevealB-0.05, uRevealB+0.015, uv.x);
    float onB = wt.g * (1.0 - sweepB);
    col = mix(col, INK, onA);
    col = mix(col, INK, onB);
    col += RED * onB * 0.06;

    // enter: the Pulse swallows the view
    col = mix(col, RED*1.08, uEnter*uEnter*0.85);

    // grain + vignette
    col += (hash(vUv*uRes + fract(uTime))*2.0-1.0) * 0.013;
    col *= mix(1.0, smoothstep(1.3,0.35,distance(vUv,vec2(0.5))), 0.22);

    gl_FragColor = vec4(col,1.0);
  }
`;

/* ---------- foreground: dust motes drifting in the light ---------- */
const PT_VERT = `
  attribute float seed; varying float vSeed;
  uniform float uTime,uMouseStr,uPR; uniform vec2 uMouse;
  void main(){
    vSeed = seed;
    vec2 pos = position.xy;
    float sp = 0.05 + seed*0.12;
    pos.y = mod(pos.y + 1.0 + uTime*sp*0.05, 2.0) - 1.0;     // rise slowly, wrap
    pos.x += sin(uTime*0.15 + seed*6.28)*0.012;
    pos += (uMouse-0.5)*0.07*uMouseStr*(0.4+seed);           // parallax
    gl_Position = vec4(pos,0.0,1.0);
    gl_PointSize = (1.2 + seed*3.0)*uPR;
  }`;
const PT_FRAG = `
  precision mediump float; varying float vSeed;
  void main(){
    float d = length(gl_PointCoord-0.5);
    float a = smoothstep(0.5,0.0,d);
    vec3 warm = mix(vec3(1.0,0.97,0.90), vec3(0.843,0.149,0.220), step(0.90,vSeed));
    gl_FragColor = vec4(warm, a*0.45);
  }`;

const renderer = new THREE.WebGLRenderer({ canvas:document.getElementById('gl'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
const scene = new THREE.Scene();
const cam = new THREE.Camera();

// word texture
const wc = document.createElement('canvas'); const wx = wc.getContext('2d');
const wordTex = new THREE.CanvasTexture(wc);
wordTex.minFilter = THREE.LinearFilter; wordTex.magFilter = THREE.LinearFilter;

const U = {
  uTime:{value:0}, uRevealA:{value:0}, uRevealB:{value:0}, uEnter:{value:0},
  uIgnite:{value:0}, uMouseStr:{value:0},
  uRes:{value:new THREE.Vector2(1,1)}, uMouse:{value:new THREE.Vector2(0.5,0.5)},
  uWord:{value:wordTex}
};
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),
  new THREE.ShaderMaterial({ vertexShader:BG_VERT, fragmentShader:BG_FRAG, uniforms:U })));

// dust
const N = 150;
const pos = new Float32Array(N*3), seed = new Float32Array(N);
for(let i=0;i<N;i++){ pos[i*3]=Math.random()*2-1; pos[i*3+1]=Math.random()*2-1; pos[i*3+2]=0; seed[i]=Math.random(); }
const pg = new THREE.BufferGeometry();
pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
pg.setAttribute('seed', new THREE.BufferAttribute(seed,1));
const PU = { uTime:U.uTime, uMouse:U.uMouse, uMouseStr:U.uMouseStr, uPR:{value:renderer.getPixelRatio()} };
scene.add(new THREE.Points(pg, new THREE.ShaderMaterial({
  vertexShader:PT_VERT, fragmentShader:PT_FRAG, uniforms:PU,
  transparent:true, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false })));

function drawWord(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
  wc.width=w*dpr; wc.height=h*dpr; wx.setTransform(dpr,0,0,dpr,0,0);
  wx.clearRect(0,0,w,h); wx.fillStyle='#000'; wx.fillRect(0,0,w,h);
  const fs=Math.min(w*0.125,190), y=h*0.66;   // flipY → appears uv.y≈0.34 (below the sun)
  const serif=`italic 500 ${fs}px "Newsreader",Georgia,serif`;
  const sans =`600 ${fs*0.86}px "IBM Plex Sans",system-ui,sans-serif`;
  wx.textBaseline='middle'; wx.textAlign='left';
  wx.font=serif; const wA=wx.measureText('Schoo').width;
  wx.font=sans;  if('letterSpacing' in wx) wx.letterSpacing=(fs*0.03)+'px';
  const wB=wx.measureText('IOS').width + fs*0.03*2; if('letterSpacing' in wx) wx.letterSpacing='0px';
  const gap=fs*0.04, total=wA+gap+wB, x0=(w-total)/2;
  wx.font=serif; wx.fillStyle='#ff0000'; wx.fillText('Schoo', x0, y);
  wx.font=sans;  wx.fillStyle='#00ff00'; if('letterSpacing' in wx) wx.letterSpacing=(fs*0.03)+'px';
  wx.fillText('IOS', x0+wA+gap, y-fs*0.015); if('letterSpacing' in wx) wx.letterSpacing='0px';
  wordTex.needsUpdate=true;
}
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  U.uRes.value.set(w,h); PU.uPR.value=renderer.getPixelRatio(); drawWord(); }
addEventListener('resize',resize);

const cur=document.getElementById('cursor'); const target=new THREE.Vector2(0.5,0.5); let lastMove=-10;
addEventListener('pointermove',e=>{ target.set(e.clientX/innerWidth,1-e.clientY/innerHeight);
  cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px'; cur.style.opacity=1; lastMove=clock.getElapsedTime(); });

let entering=false;
addEventListener('pointerdown',()=>{ if(entering)return; entering=true;
  gsap.timeline({onComplete:()=>{entering=false;}})
    .to(U.uEnter,{value:1.0,duration:1.1,ease:'power2.in'})
    .add('back')
    .to(U.uEnter,{value:0.0,duration:1.3,ease:'power2.out'},'back+=0.1');
});

const clock=new THREE.Clock();
function loop(){
  const t=clock.getElapsedTime(); U.uTime.value=t;
  U.uMouse.value.lerp(target,0.045);
  const since=t-lastMove; const want=since<0.1?1.0:Math.max(0,1-since*0.8);
  U.uMouseStr.value += (want-U.uMouseStr.value)*0.06;
  renderer.render(scene,cam); requestAnimationFrame(loop);
}

async function boot(){
  try{
    await document.fonts.load('italic 500 200px "Newsreader"','Schoo');
    await document.fonts.load('600 200px "IBM Plex Sans"','IOS');
    await document.fonts.load('500 12px "Geist Mono"','Đang');
    await document.fonts.ready;
  }catch(e){}
  resize(); loop();
  const ld=document.getElementById('loading');
  gsap.to(ld,{opacity:0,duration:0.8,delay:0.3,onComplete:()=>ld.remove()});

  gsap.timeline({delay:0.3})
    .to(U.uIgnite,  {value:1.0,duration:1.0,ease:'power3.out'}, 0)      // the Pulse wakes
    .to(U.uRevealA, {value:1.0,duration:3.0,ease:'power2.out'}, 1.1)    // serif blooms
    .to(U.uRevealB, {value:1.0,duration:1.4,ease:'power4.out'}, 2.2)    // system snaps
    .to('#manifesto',{opacity:1,duration:1.8,ease:'power1.out'}, 2.7)
    .to('#hint',     {opacity:1,duration:1.6,ease:'power1.out'}, 3.7);
}
boot();
</script>
</body>
</html>
