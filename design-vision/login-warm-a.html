<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchooIOS — Warm A (Linen · Camel · Cocoa · Espresso)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#F5F1EA; --khaki:#D7C9B8; --camel:#B2967D; --cocoa:#7D5A44; --espresso:#4A342A;
    --linen-2:#FBF8F1; --camel-soft:#C9B49C;
    --disp:'Cormorant Garamond',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--espresso);
    background:
      radial-gradient(120% 90% at 12% 8%, #FBF8F1 0%, transparent 55%),
      radial-gradient(90% 80% at 92% 96%, #EFE6D7 0%, transparent 60%),
      var(--linen);
    display:grid;grid-template-columns:1.15fr .85fr;min-height:100vh}
  /* warm grain */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.035'/></svg>")}

  /* LEFT — warm editorial hero */
  .hero{padding:72px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--camel)}
  .mark{font-family:var(--disp);font-weight:500;font-size:clamp(64px,9vw,128px);line-height:.92;letter-spacing:-.01em;color:var(--espresso)}
  .mark .s{font-style:italic;font-weight:500}
  .mark .i{font-weight:600;letter-spacing:.01em}
  .mark .dot{color:var(--camel)}
  .lede{font-family:var(--disp);font-style:italic;font-weight:500;font-size:clamp(22px,2.4vw,30px);line-height:1.3;color:var(--cocoa);max-width:20ch;margin-top:28px}
  .rule{height:1px;background:var(--camel-soft);width:64px;margin:26px 0 0}
  .foot{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--camel);display:flex;gap:18px}
  .foot b{color:var(--cocoa);font-weight:500}

  /* RIGHT — soft cozy card */
  .pane{display:flex;align-items:center;justify-content:center;padding:48px 56px 48px 24px}
  .card{width:100%;max-width:380px;background:var(--linen-2);border:1px solid var(--khaki);
    border-radius:22px;padding:40px 36px;box-shadow:0 26px 60px -34px rgba(74,52,42,.45)}
  .ctitle{font-family:var(--disp);font-style:italic;font-weight:600;font-size:34px;line-height:1;color:var(--espresso)}
  .csub{font-size:13.5px;line-height:1.6;color:var(--cocoa);margin-top:10px;opacity:.85}
  .field{margin-top:26px}
  .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--camel);display:block;margin-bottom:9px}
  .inp{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--khaki);
    padding:6px 2px 9px;font-family:var(--sans);font-size:15px;color:var(--espresso);outline:none}
  .inp::placeholder{color:var(--camel-soft)}
  .inp:focus{border-color:var(--cocoa)}
  .btn{margin-top:30px;width:100%;background:var(--cocoa);color:var(--linen);border:none;border-radius:13px;
    padding:15px;font-family:var(--sans);font-weight:600;font-size:14.5px;letter-spacing:.02em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s}
  .btn:hover{background:var(--espresso)}
  .help{margin-top:18px;font-size:12px;color:var(--camel);text-align:center}
  .help a{color:var(--cocoa);text-decoration:underline;text-underline-offset:2px}
  @media(max-width:860px){body{grid-template-columns:1fr}.pane{padding:0 24px 56px}.hero{padding:56px 32px 24px}}
</style></head><body>
  <section class="hero">
    <div class="kick">Hệ thống quản lý sự vụ học đường</div>
    <div>
      <div class="mark"><span class="s">Schoo</span><span class="dot">·</span><span class="i">IOS</span></div>
      <div class="lede">Mỗi tiếng nói đều được lắng nghe, phân loại và theo dấu đến khi khép lại.</div>
      <div class="rule"></div>
    </div>
    <div class="foot"><span>Trường THPT Chuyên <b>Lý Tự Trọng</b></span><span>CASE-2026</span></div>
  </section>

  <section class="pane">
    <div class="card">
      <div class="ctitle">Bước vào</div>
      <div class="csub">Đăng nhập bằng số báo danh (học sinh) hoặc email (cán bộ).</div>
      <div class="field"><label class="lbl">Số báo danh / Email</label>
        <input class="inp" placeholder="220145 hoặc gv@ltt.edu.vn"></div>
      <div class="field"><label class="lbl">Mật khẩu</label>
        <input class="inp" type="password" placeholder="••••••••"></div>
      <button class="btn">Bước vào &nbsp;→</button>
      <div class="help">Lần đầu đăng nhập? Bạn sẽ được yêu cầu đổi mật khẩu. <a href="#">Trợ giúp</a></div>
    </div>
  </section>
</body></html>
